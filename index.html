<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beatpad</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=JetBrains+Mono:wght@700&display=swap">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header class="page-header">
    <div>
      <h1>Beatpad</h1>
      <p class="intro">Toque os pads com o mouse ou com o teclado.</p>
    </div>
    <p class="keys-hint">Teclas: A S D F · J K L Ç</p>
  </header>

  <main class="drum-machine">
    <button class="pad" type="button" data-sound="kick">
      <span class="pad-key">A</span>
      <span class="pad-name">Bumbo</span>
    </button>
    <button class="pad" type="button" data-sound="snare">
      <span class="pad-key">S</span>
      <span class="pad-name">Caixa</span>
    </button>
    <button class="pad" type="button" data-sound="hihat">
      <span class="pad-key">D</span>
      <span class="pad-name">Chimbal</span>
    </button>
    <button class="pad" type="button" data-sound="open-hihat">
      <span class="pad-key">F</span>
      <span class="pad-name">Chimbal aberto</span>
    </button>
    <button class="pad" type="button" data-sound="clap">
      <span class="pad-key">J</span>
      <span class="pad-name">Palmas</span>
    </button>
    <button class="pad" type="button" data-sound="low-tom">
      <span class="pad-key">K</span>
      <span class="pad-name">Tom grave</span>
    </button>
    <button class="pad" type="button" data-sound="high-tom">
      <span class="pad-key">L</span>
      <span class="pad-name">Tom agudo</span>
    </button>
    <button class="pad" type="button" data-sound="crash">
      <span class="pad-key">Ç</span>
      <span class="pad-name">Prato</span>
    </button>
  </main>
</body>
</html>
